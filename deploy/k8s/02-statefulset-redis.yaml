# ============================================================
# z-cache —— StatefulSet #1：redis（官方镜像）
#
# 【镜像 tag 为什么这样写】
#   image: redis:7-alpine
#   —— 官方 Docker Hub 镜像的**裸引用**（不带 Nexus 仓库前缀）。
#      铁律：本集群 imagePullPolicy=Never，镜像只存在于两个节点的 containerd，
#      k3s 不会去拉，它按 `image:` 字段的**字面引用**去节点本地 content store 里找。
#      喂进 containerd 的引用必须与这一行逐字一致。
#      （注意：z-cache 域的另一个 StatefulSet 用的是带前缀的
#        docker.io/library/z-cache:1.3.6 —— 那是官方 library 前缀，
#        同样要求「喂什么就写什么」，见 03-statefulset-zcache.yaml。）
#
# 【探针为什么是 exec redis-cli ping】
#   照抄线上：exec `redis-cli ping`（failureThreshold 3 / period 10 / timeout 1）。
#   这是 redis 官方镜像的惯用探法，答 PONG 即活；不用 httpGet 是因为
#   redis 没有 HTTP 面。
#
# 【数据盘】
#   volumeClaimTemplates: data（2Gi，RWO，Filesystem）⇒ StatefulSet 自己的 PVC
#   模板，**不需要**独立的 04-pvc.yaml。线上对应 PVC 是 data-redis-0
#   （storageClass local-path，绑在 zifang002）。
#   persistentVolumeClaimRetentionPolicy: Retain/Retain ⇒ 缩容/删除 StatefulSet
#   时**不删**数据盘（线上就是这个值，保持数据）。
#
# 【secret 从哪来】
#   本域**无 secret**（基线导出里没有 secretKeyRef）。
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: z-cache
  labels:
    app: redis
    app.kubernetes.io/part-of: z-opc-foundation
spec:
  replicas: 1
  # governing service（照抄线上；注意它不是 headless，见 01-service.yaml 里的说明）
  serviceName: redis
  # 保留 10 个历史版本 ⇒ `kubectl rollout undo statefulset/redis -n z-cache` 可用。
  revisionHistoryLimit: 10
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  # 缩容/删除时不回收数据盘（线上同值）。
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: Never
          # 开启 AOF 持久化（线上同参）。
          args:
            - --appendonly
            - "yes"
          ports:
            - containerPort: 6379
              protocol: TCP
          # 探针照抄线上：exec redis-cli ping。
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 1
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 6
            timeoutSeconds: 1
          # 线上本容器**没有设 resources**（resources: {}）⇒ 照抄，不擅自加。
          resources: {}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        volumeMode: Filesystem
        resources:
          requests:
            storage: 2Gi
