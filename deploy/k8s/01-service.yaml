# ============================================================
# z-cache —— Services（两个，NodePort）
# 线上实况（/tmp/zdeploy-base/z-cache.yaml 导出为准）：
#   Service  redis     NodePort  6379 → targetPort 6379  nodePort 30901
#            selector  app=redis
#   Service  z-cache   NodePort  6379 → targetPort 6379  nodePort 31001
#            selector  app=z-cache
#
# 本域是两个并排的缓存实现（官方 redis 与自研 z-cache），端口协议一样（都是 6379），
# 但**是两个独立的 Service + 两个独立的 StatefulSet + 两块独立的数据盘**，
# 互不共享数据、互不共享端口号（30901 / 31001）。
#
# ⚠ 与 StatefulSet 规范的一处偏差（照抄线上，未改）：
#   StatefulSet 的 governing service（serviceName）按 k8s 规范应是 headless
#   （clusterIP: None），这样才有稳定 DNS `redis-0.redis.z-cache.svc...`。
#   线上这两个 Service 都是 NodePort（有 clusterIP）⇒ 拿不到 per-pod 稳定 DNS。
#   照抄现状（改它会动到既有访问方式，且要单独评估），但要知道这条偏差。
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: z-cache
  labels:
    app: redis
    app.kubernetes.io/part-of: z-opc-foundation
spec:
  type: NodePort
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      nodePort: 30901
---
apiVersion: v1
kind: Service
metadata:
  name: z-cache
  namespace: z-cache
  labels:
    app: z-cache
    # 线上 Service 上带着这个标签（用途：标记它是 redis 的对比实现）⇒ 照抄。
    compare-target: redis
    app.kubernetes.io/part-of: z-opc-foundation
spec:
  type: NodePort
  selector:
    app: z-cache
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      nodePort: 31001
