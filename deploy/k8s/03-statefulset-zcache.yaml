# ============================================================
# z-cache —— StatefulSet #2：z-cache（自研实现）
#
# 【镜像 tag 为什么这样写】
#   image: docker.io/library/z-cache:1.3.6
#   —— 线上就是这条引用（带官方 library 前缀，**不是** Nexus 前缀）⇒ 照抄。
#      铁律：本集群 imagePullPolicy=Never，镜像只存在于两个节点的 containerd，
#      k3s 不会去拉，它按 `image:` 字段的**字面引用**去节点本地 content store 里找。
#      ⇒ 喂镜像时本地 tag 必须**恰好是** docker.io/library/z-cache:1.3.6
#        （docker build 出来默认是 z-cache:1.3.6，要 docker tag 补上前缀），
#        否则节点上查不到 ⇒ Pod 卡 ErrImageNeverPull。
#      ⚠ 铁律仍是「禁 Nexus 前缀」：Nexus 是私服前缀，与官方 library 前缀不是一回事；
#        喂成 nexus.internal/.../z-cache:1.3.6 而清单写 docker.io/library/... ⇒ 一样拉不到。
#
# 【探针为什么选 tcpSocket 6379】
#   照抄线上：tcpSocket 6379（initialDelay 5 / period 5 / failureThreshold 3 /
#   timeout 1）⇒ 只证「端口在监听」。自研 z-cache 没有官方 redis 的 redis-cli，
#   镜像里自带的 HealthCheck 类（com.zifang.z.cache.server.HealthCheck）不在本清单
#   的探针口径里，保持线上原样最稳。
#
# 【调度】
#   nodeSelector: kubernetes.io/hostname=zifang001 —— 照抄线上，**必须保留**：
#   本 StatefulSet 用的是**独立 PVC z-cache-data**（不是 volumeClaimTemplates），
#   那块盘是 local-path 节点本地存储、已绑在 zifang001
#   （PV 注解 volume.kubernetes.io/selected-node=zifang001）。
#   去掉 nodeSelector ⇒ Pod 可能落到 zifang002 ⇒ volume 挂不上，一直 Pending。
#
# 【数据盘】
#   独立 PVC z-cache-data ⇒ 见 04-pvc.yaml（2Gi，RWO，local-path，Filesystem）。
#   persistentVolumeClaimRetentionPolicy: Retain/Retain（线上同值）⇒ 删 StatefulSet
#   不删盘。
#
# 【secret 从哪来】
#   本域**无 secret**（基线导出里没有 secretKeyRef）。
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: z-cache
  namespace: z-cache
  labels:
    app: z-cache
    # 线上 StatefulSet 上带着这个标签（用途：标记它是 redis 的对比实现）⇒ 照抄。
    compare-target: redis
    app.kubernetes.io/part-of: z-opc-foundation
spec:
  replicas: 1
  # governing service（照抄线上；注意它不是 headless，见 01-service.yaml 里的说明）
  serviceName: z-cache
  # 保留 10 个历史版本 ⇒ `kubectl rollout undo statefulset/z-cache -n z-cache` 可用。
  revisionHistoryLimit: 10
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  # 缩容/删除时不回收数据盘（线上同值）。
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: z-cache
  template:
    metadata:
      labels:
        app: z-cache
    spec:
      # 数据盘是节点本地盘（已绑 zifang001）⇒ 调度钉死该节点，理由见文件头。
      nodeSelector:
        kubernetes.io/hostname: zifang001
      containers:
        - name: z-cache
          image: docker.io/library/z-cache:1.3.6
          imagePullPolicy: Never
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          env:
            # 监听地址 / 端口 / 最大条目数（0 = 不限）：与线上逐字一致。
            - name: ZCACHE_HOST
              value: "0.0.0.0"
            - name: ZCACHE_PORT
              value: "6379"
            - name: ZCACHE_MAX_ENTRIES
              value: "0"
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          # 探针照抄线上：tcpSocket 6379。
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 1
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 6
            timeoutSeconds: 1
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: z-cache-data
