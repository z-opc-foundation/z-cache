services:
  z-cache:
    build:
      context: ..
      dockerfile: z-cache/Dockerfile
      additional_contexts:
        - maven-m2=${HOST_M2:-${HOME}/.m2}
    image: ${ZCACHE_IMAGE:-z-cache:latest}
    container_name: ${ZCACHE_CONTAINER:-z-cache}
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: ${ZCACHE_MEMORY_LIMIT:-512m}
    environment:
      ZCACHE_HOST: 0.0.0.0
      ZCACHE_PORT: 6379
      ZCACHE_MAX_ENTRIES: ${ZCACHE_MAX_ENTRIES:-0}
      ZCACHE_PASSWORD: ${ZCACHE_PASSWORD:-}
      ZCACHE_PASSWORD_FILE: ${ZCACHE_PASSWORD_FILE:-}
    ports:
      - "${ZCACHE_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$ZCACHE_PASSWORD_FILE\" ]; then exec java -cp /app/z-cache-server.jar com.zifang.z.cache.server.HealthCheck --port 6379 --password-file \"$$ZCACHE_PASSWORD_FILE\"; else exec java -cp /app/z-cache-server.jar com.zifang.z.cache.server.HealthCheck --port 6379 --password \"$$ZCACHE_PASSWORD\"; fi"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
